[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-search"
version = "0.1.0"
description = "个人讲义库的中文全文检索 + 语义检索服务"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jingkai Lin", email = "linjingkai719@163.com" }]
keywords = ["full-text-search", "sqlite-fts5", "hybrid-retrieval", "chinese-nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "typer>=0.12",          # CLI
    "pymupdf>=1.24",        # PDF 解析
    "httpx>=0.27",          # embedding API / HTTP 客户端
    "numpy>=1.26",          # 向量运算
    "python-dotenv>=1.0",   # .env 支持
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
notes-search = "notes_search.cli:app"

[project.urls]
Homepage = "https://github.com/KevinLIN719/notes-search"
Repository = "https://github.com/KevinLIN719/notes-search"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
